[project]
name = "counsel"
version = "0.1.0"
description = "금융 상담 RAG + 고객 에이전트 시뮬레이션 루프"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "kiwipiepy>=0.24.0",
    "lancedb>=0.39.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=24,<25",
    "pyyaml>=6.0.3",
    "streamlit>=1.65.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.18.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
